[project]
name = "dagster_hpt"
requires-python = ">=3.13,<3.15"
version = "0.1.0"
dependencies = [
    "dagster==1.13.7",
    "healthcare-price-transparency",
    "dagster-dbt",
    "dagster-aws",
    "dbt-databricks",
]

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "dagster-webserver",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "dagster_hpt"
registry_modules = [
    "dagster_hpt.components.*",
]

[tool.uv.sources]
healthcare-price-transparency = { path = "..", editable = true }
