        data_type: int
        tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
              config:
                severity: warn
      - name: overall_rating_footnote
        description: "CMS footnote code for overall rating. Null when no footnote applies."
        data_type: string
      - name: mort_better
        description: "Number of Mortality measures better than the national value."
        data_type: int
      - name: mort_no_different
        description: "Number of Mortality measures no different than the national value."
        data_type: int
      - name: mort_worse
        description: "Number of Mortality measures worse than the national value."
        data_type: int
      - name: safety_better
        description: "Number of Safety measures better than the national value."
        data_type: int
      - name: safety_no_different
        description: "Number of Safety measures no different than the national value."
        data_type: int
      - name: safety_worse
        description: "Number of Safety measures worse than the national value."
        data_type: int
      - name: readm_better
        description: "Number of Readmission measures better than the national value."
        data_type: int
      - name: readm_no_different
        description: "Number of Readmission measures no different than the national value."
        data_type: int
      - name: readm_worse
        description: "Number of Readmission measures worse than the national value."
        data_type: int
      - name: pt_exp_facility_count
        description: "Number of Patient Experience measures used in this hospital's star rating."
        data_type: int
      - name: pt_exp_footnote
        description: "CMS footnote code for the Patient Experience measure group. Null when no footnote applies."
        data_type: string
      - name: te_facility_count
        description: "Number of Timely and Effective Care measures used in this hospital's star rating."
