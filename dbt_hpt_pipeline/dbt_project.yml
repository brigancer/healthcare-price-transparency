name: dbt_hpt_pipeline

profile: dbt_hpt_pipeline

seed-paths: ["seeds"]
model-paths: ["models"]
macro-paths: ["macros"]
clean-targets:
  - "target"
  - "dbt_packages"

seeds:
  dbt_hpt_pipeline:
    +schema: seeds  # Builds seeds into hpt_dev_seeds schema

models:
  dbt_hpt_pipeline:
    # Silver models declare their own materialization in dbt.config()
    # Gold models are materialized as tables
    gold:
      +materialized: table